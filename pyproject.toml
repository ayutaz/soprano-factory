[project]
name = "soprano-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets<3",
    "einops>=0.8.1",
    "huggingface-hub>=0.36.0",
    "librosa>=0.11.0",
    "numpy>=2.0.2",
    "pyopenjtalk-plus>=0.4.0",
    "scipy>=1.13.1",
    "soprano-tts>=0.2.0",
    "soundfile>=0.13.1",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.5",
    "wandb>=0.24.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
